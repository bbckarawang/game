<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Domino Gaple P2P</title>
<style>
:root{--felt:#0f3d2e;--felt2:#145240;--ivory:#f6f0df;--brass:#d2a94a;--wine:#8a2433;--ink:#1d1a16;--h:26px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:#0a2a20;color:var(--ivory);font-family:Georgia,'Palatino Linotype',serif;overflow:hidden}
button,input,select{font:inherit}
#app{max-width:480px;height:100%;margin:auto;position:relative;background:radial-gradient(120% 80% at 50% 30%,var(--felt2),var(--felt));display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.pad{padding:18px;gap:12px;display:flex;flex-direction:column;overflow-y:auto}
.scr{display:none;flex:1;flex-direction:column;min-height:0}.scr.on{display:flex}
h1{font-size:34px;margin:0;letter-spacing:.5px;color:var(--brass)}
.btn{background:var(--brass);color:var(--ink);border:0;border-radius:14px;padding:13px 16px;font-weight:700;box-shadow:0 3px 0 #8c6d22;transition:.1s;flex-shrink:0;cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:none}.btn.g{background:#ffffff18;color:var(--ivory);box-shadow:none;border:1px solid #ffffff30}
.btn[disabled]{opacity:.4;pointer-events:none}
input,select{background:#00000030;border:1px solid #ffffff30;color:var(--ivory);border-radius:12px;padding:12px;width:100%;user-select:text}
.emo{display:flex;flex-wrap:wrap;gap:6px}.emo span{font-size:26px;padding:4px 7px;border-radius:12px;border:2px solid transparent;cursor:pointer}.emo span.s{border-color:var(--brass);background:#ffffff18}
.card{background:#00000028;border:1px solid #ffffff1f;border-radius:16px;padding:12px;flex-shrink:0}
.pl{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #ffffff14}.pl b{flex:1}
/* tile */
.t{display:inline-flex;background:linear-gradient(145deg,#fffdf4,#e9dfc4);border-radius:7px;box-shadow:0 2px 0 #b9ad8c,0 4px 8px #0006;color:var(--ink);flex:none;position:relative;overflow:hidden}
.t.v{flex-direction:column}
.t i{width:var(--h);height:var(--h);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:2.5px;gap:1px;flex:none}
.t i+i{border-left:1.5px solid #8a7e5e66}
.t.v i+i{border-left:0;border-top:1.5px solid #8a7e5e66}
.t u{border-radius:50%;background:var(--ink);align-self:center;justify-self:center;width:76%;height:76%}
.t u.r{background:var(--wine)}
.back{background:repeating-linear-gradient(45deg,#7a1f2b,#7a1f2b 4px,#5e1520 4px,#5e1520 8px)!important}
/* game */
#top{display:flex;gap:6px;padding:8px;overflow-x:auto;scrollbar-width:none;flex-shrink:0}
.chip{flex:none;min-width:66px;text-align:center;background:#00000030;border:2px solid transparent;border-radius:14px;padding:5px 8px;font-size:12px;transition:.25s}
.chip em{font-style:normal;font-size:24px;display:block}.chip.on{border-color:var(--brass);box-shadow:0 0 16px #d2a94a77;transform:translateY(-2px)}.chip.off{opacity:.4}
#board{flex:1;overflow:auto;padding:14px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0}
.chain-wrap{display:flex;flex-direction:column;align-items:stretch;width:100%;max-width:440px}
.row{display:flex;align-items:center;justify-content:flex-start;gap:2px;min-height:calc(var(--h)*2 + 4px);position:relative}
.row.rev{justify-content:flex-end}
.row span{display:inline-flex;align-items:center;position:relative;flex:none}
/* sambungan horizontal antar ubin dalam satu baris */
.row span+span::before{content:'';width:2px;height:10px;background:#d2a94a99;border-radius:2px;margin-right:1px}
/* belokan vertikal penghubung antar baris */
.turn-v{display:flex;align-items:center;height:calc(var(--h)*2 + 2px);position:relative;flex:none}
.turn-v.r{justify-content:flex-end;padding-right:4px}
.turn-v.l{justify-content:flex-start;padding-left:4px}
.turn-v::before{content:'';position:absolute;width:2px;top:-4px;bottom:-4px;background:linear-gradient(to bottom,#d2a94a99,#d2a94a55)}
.turn-v.r::before{right:calc(var(--h) + 2px)}
.turn-v.l::before{left:calc(var(--h) + 2px)}
#bar{min-height:44px;display:flex;gap:8px;justify-content:center;align-items:center;padding:4px 10px;font-size:13px;flex-shrink:0}
#hand{display:flex;gap:7px;padding:18px 12px 10px;overflow-x:auto;min-height:calc(var(--h)*2 + 34px);align-items:flex-end;flex-shrink:0;scrollbar-width:none}
#hand::-webkit-scrollbar{display:none}
#hand>span{display:inline-flex;flex:none}
#hand .t{--h:30px;transition:transform .15s,opacity .2s,box-shadow .15s;cursor:pointer}
#hand .t.ok{transform:translateY(-10px);box-shadow:0 0 0 2px var(--brass),0 6px 12px #0008}
#hand .t.no{opacity:.45}
#hand .t.sel{transform:translateY(-16px) scale(1.06);box-shadow:0 0 0 2px #fff,0 8px 14px #0009}
#dock{display:flex;gap:8px;padding:4px 10px 10px;flex-shrink:0}#dock .btn{flex:1;padding:10px}
#toasts{position:absolute;top:calc(env(safe-area-inset-top) + 64px);left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:9}
.toast{background:#101010e6;border:1px solid var(--brass);border-radius:20px;padding:8px 16px;font-size:14px;animation:ti .35s cubic-bezier(.2,1.4,.4,1),to .4s 2.3s forwards;max-width:90%;box-shadow:0 6px 18px #0008}
.toast.c{background:#f6f0dff2;color:var(--ink);border-color:#fff}
@keyframes ti{from{transform:translateY(-30px) scale(.7);opacity:0}}@keyframes to{to{opacity:0;transform:translateY(-14px)}}
#chat{position:absolute;left:0;right:0;bottom:0;background:#0c241cf5;border-top:2px solid var(--brass);border-radius:20px 20px 0 0;padding:12px;transform:translateY(105%);transition:.3s;z-index:8;max-height:70%;display:flex;flex-direction:column;gap:8px}
#chat.on{transform:none}#log{overflow:auto;flex:1;min-height:90px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.qk{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}.qk span{flex:none;background:#ffffff1c;border-radius:16px;padding:6px 11px;font-size:13px;cursor:pointer}
.fl{position:absolute;bottom:90px;font-size:34px;animation:fl 2s ease-out forwards;pointer-events:none;z-index:7}
@keyframes fl{to{transform:translateY(-55vh) rotate(20deg) scale(1.6);opacity:0}}
#ov{position:absolute;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:10;flex-direction:column;gap:12px;text-align:center;padding:20px;overflow-y:auto}#ov.on{display:flex}
.suit-btns{display:flex;gap:12px;margin-top:6px}.suit-btn{font-size:34px;width:82px;height:82px;border-radius:20px;border:2px solid var(--brass);background:#ffffff18;color:var(--ivory);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:.12s}.suit-btn small{font-size:11px;font-weight:700}.suit-btn:active,.suit-btn.picked{transform:scale(.95);background:var(--brass);color:var(--ink)}.suit-btn[disabled]{opacity:.55;pointer-events:none}
.shuf{position:relative;width:140px;height:90px}.shuf .t{position:absolute;left:50px;top:20px;--h:26px;animation:sh .5s ease-in-out infinite alternate}
@keyframes sh{from{transform:translate(-50px,0) rotate(-25deg)}to{transform:translate(50px,-10px) rotate(25deg)}}
.hint{opacity:.7;font-size:13px}.shake{animation:sk .3s}@keyframes sk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style></head><body>
<div id="app">
<div id="home" class="scr on pad"><h1>🁣 Domino Gaple</h1><div class="hint">Main bareng 2–8 HP lewat room. Tanpa server, tanpa akun.</div>
<input id="nm" maxlength="12" placeholder="Nama kamu"><div class="emo" id="eo"></div>
<button class="btn" id="mk">Buat room baru</button>
<div class="card" style="display:flex;gap:8px"><input id="cd" maxlength="4" placeholder="KODE" style="text-transform:uppercase"><button class="btn" id="jn">Gabung</button></div>
<div class="hint" id="hs"></div></div>
<div id="lobby" class="scr pad"><h1>Ruang tunggu</h1>
<div class="card"><div class="hint">Kode room</div><div style="font-size:40px;letter-spacing:8px;color:var(--brass)" id="rc"></div><button class="btn g" id="cp" style="margin-top:6px">📋 Salin link ajakan</button></div>
<div class="card" id="pls"></div>
<div id="hopt" class="card" style="display:none;gap:8px;flex-direction:column">
<select id="md"><option value="gaple">Gaple (tanpa ambil kartu, lewat jika buntu)</option><option value="draw">Draw (ambil dari tumpukan)</option></select>
<select id="tg"><option value="50">Target skor 50</option><option value="100" selected>Target skor 100</option><option value="150">Target skor 150</option></select></div>
<button class="btn" id="go" style="display:none">Kocok &amp; mulai 🎲</button><div class="hint" id="wt"></div></div>
<div id="game" class="scr"><div id="top"></div><div id="board"></div><div id="bar"></div><div id="hand"></div>
<div id="dock"><button class="btn g" id="dr">🃏 Ambil</button><button class="btn g" id="ps">😴 Lewat</button><button class="btn g" id="ct" style="flex:0 0 56px">💬</button></div></div>
<div id="toasts"></div>
<div id="chat"><div id="log"></div><div class="qk" id="rx"></div><div class="qk" id="qk"></div><div style="display:flex;gap:6px"><input id="ci" maxlength="60" placeholder="Ketik pesan…"><button class="btn" id="cs" style="padding:10px 14px">Kirim</button></div><button class="btn g" id="cc" style="padding:8px">Tutup</button></div>
<div id="ov"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const $=s=>document.querySelector(s),R=a=>a[Math.random()*a.length|0],EM=['😎','🤠','🦊','🐸','🐼','👻','🤡','🐙','🦄','🐯'];
const PIP=[[],[4],[0,8],[0,4,8],[0,2,6,8],[0,2,4,6,8],[0,2,3,5,6,8],[0,2,3,4,5,6,8],[0,1,2,3,5,6,7,8],[0,1,2,3,4,5,6,7,8]];
const QK=['Gaple sakti! 😎','Kartuku jelek amat 😭','Jangan dikunci dong 🙏','Awas, kubalas nanti 😈','Kok lewat terus? 🤣','Ampun bang 🥲','Cepetan dong, keburu basi ⏳','Hoki doang itu 🤡'],RX=['😂','🔥','😭','😈','🤡','👏','🥶','💀'];
const SUIT={rock:'✊',paper:'🖐️',scissors:'✌️'};

// H = state otoritatif khusus host; S = state tampilan klien/host
let H=null,S=null,me,host=false,peer,conns={},hc,code,lastSeq=-1,sel=null,name,emo=R(EM),fly=null,ac,mute=false,suitChoice=null,firstPlayTimer=null,lastSuitKey='';

/* ---- suara ---- */
function tn(f,d,ty='sine',v=.15,t=0,sl){try{ac=ac||new AudioContext();if(ac.state==='suspended')ac.resume();const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime+t;o.type=ty;o.frequency.setValueAtTime(f,n);if(sl)o.frequency.exponentialRampToValueAtTime(sl,n+d);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g).connect(ac.destination);o.start(n);o.stop(n+d)}catch(e){}}
const SND={play:()=>{tn(190,.09,'square',.2,0,70);tn(620,.12,'triangle',.1,.02)},draw:()=>tn(260,.18,'sine',.18,0,900),pass:()=>{tn(420,.5,'sine',.22,0,110);tn(300,.4,'triangle',.1,.1,90)},no:()=>tn(120,.2,'sawtooth',.12,0,80),chat:()=>{tn(700,.06,'sine',.12);tn(1000,.08,'sine',.1,.06)},turn:()=>{tn(880,.12,'triangle',.1);tn(1320,.15,'triangle',.08,.1)},shuf:()=>{for(let i=0;i<14;i++)tn(120+Math.random()*200,.05,'square',.06,i*.09)},win:()=>[523,659,784,1047,784,1047].forEach((f,i)=>tn(f,.2,'triangle',.18,i*.12)),lose:()=>[400,330,260,180].forEach((f,i)=>tn(f,.25,'sawtooth',.12,i*.15))};
const snd=k=>!mute&&SND[k]&&SND[k]();

/* ---- ui kecil ---- */
function toast(h,c=''){const d=document.createElement('div');d.className='toast '+c;d.innerHTML=h;$('#toasts').append(d);setTimeout(()=>d.remove(),2800)}
function float(e){for(let i=0;i<3;i++){const d=document.createElement('div');d.className='fl';d.textContent=e;d.style.left=(10+Math.random()*75)+'%';d.style.animationDelay=i*.15+'s';$('#app').append(d);setTimeout(()=>d.remove(),2400)}}
function tile(a,b,v){let h=x=>`<i>${[...Array(9)].map((_,k)=>PIP[x].includes(k)?`<u class="${x==6||x==9?'r':''}"></u>`:'<span></span>').join('')}</i>`;return `<div class="t ${v?'v':''}" data-a="${a}" data-b="${b}">${h(a)}${h(b)}</div>`}
const esc=s=>String(s).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
function show(id){document.querySelectorAll('.scr').forEach(e=>e.classList.toggle('on',e.id==id))}

/* ---- jaringan ---- */
const ID=c=>'gdom-'+c;
function startHost(){
  code=Array.from({length:4},()=>R([...'ABCDEFGHJKMNPQRSTUVWXYZ23456789'])).join('');
  if(peer)try{peer.destroy()}catch(e){}
  peer=new Peer(ID(code));
  peer.on('error',e=>{
    $('#mk').disabled=false;$('#mk').textContent='Buat room baru';
    if(e.type=='unavailable-id')startHost();
    else toast('⚠️ Jaringan: '+e.type);
  });
  peer.on('open',()=>{
    host=true;me='H';
    H={phase:'lobby',players:[{id:'H',name,emo,score:0}],mode:'gaple',target:100,seq:0,chain:[],yard:[],passes:0,res:null,suit:null};
    bc();show('lobby');
  });
  peer.on('connection',c=>{
    c.on('data',m=>hrecv(c,m));
    c.on('close',()=>{
      if(!H)return;
      const p=H.players.find(p=>p.id==c.peer);if(!p)return;
      if(H.phase=='lobby')H.players=H.players.filter(x=>x!=p);
      else{
        p.off=true;
        toast(p.emo+' '+esc(p.name)+' kabur 🏃');
        if(H.phase==='suit')checkSuitProgress();
        else if(H.players[H.turn]==p)setTimeout(auto,700);
      }
      bc();
    });
  });
}

function join(c){
  code=c.toUpperCase();
  $('#jn').disabled=true;$('#jn').textContent='Masuk…';
  if(peer)try{peer.destroy()}catch(e){}
  peer=new Peer();
  peer.on('error',e=>{
    $('#jn').disabled=false;$('#jn').textContent='Gabung';
    toast('⚠️ '+(e.type=='peer-unavailable'?'Room tidak ketemu':e.type));
  });
  peer.on('open',id=>{
    me=id;hc=peer.connect(ID(code),{reliable:true});
    hc.on('open',()=>hc.send({t:'hi',name,emo}));
    hc.on('data',m=>{
      if(m.t=='s')onState(m.s);
      else if(m.t=='c')onChat(m);
      else if(m.t=='full'){
        $('#jn').disabled=false;$('#jn').textContent='Gabung';
        toast('Room penuh / sudah mulai 🚫');
      }
    });
    hc.on('close',()=>{toast('Terputus dari host 😵');setTimeout(()=>location.reload(),1800)});
  });
}

function hrecv(c,m){
  if(!H)return;
  if(m.t=='hi'){
    if(H.phase!='lobby'||H.players.length>=8){c.send({t:'full'});return setTimeout(()=>c.close(),300)}
    conns[c.peer]=c;
    H.players.push({id:c.peer,name:m.name,emo:m.emo,score:0});
    bc();
  }else act(c.peer,m);
}

function suitStatus(){
  if(!H||!H.suit)return null;
  const active=H.players.filter(p=>!p.off);
  const doneCount=active.filter(p=>Boolean(H.suit.picks && H.suit.picks[p.id])).length;
  return {
    total: active.length,
    doneCount,
    myDone: false, // diisi di view(pid)
    draw: Boolean(H.suit.draw)
  };
}

function view(pid){
  const st=suitStatus();
  if(st&&H.suit){
    st.myDone=Boolean(H.suit.picks && H.suit.picks[pid]);
  }
  return{
    phase:H.phase,
    mode:H.mode,
    target:H.target,
    seq:H.seq,
    ev:H.ev,
    turn:H.turn,
    chain:H.chain,
    res:H.res,
    yn:(H.yard||[]).length,
    suit:st,
    players:H.players.map(p=>({
      id:p.id,name:p.name,emo:p.emo,score:p.score,off:p.off,
      n:(p.hand||[]).length,
      hand:p.id==pid||(H.res)?p.hand:undefined
    }))
  };
}
function bc(){
  for(const id in conns)if(conns[id].open)conns[id].send({t:'s',s:view(id)});
  onState(view('H'));
}
function send(m){host?act('H',m):hc&&hc.open&&hc.send(m)}

/* ---- aturan domino & pembuka (host menggunakan H) ---- */
const sh=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const sides=(t,chain)=>{const c=chain||[];if(!c.length)return['R'];const L=c[0][0],Rr=c.at(-1)[1],r=[];if(t.includes(L))r.push('L');if(t.includes(Rr))r.push('R');return r};
const can=(h,chain)=>(h||[]).some(t=>sides(t,chain).length);
const em=(k,o={})=>{H.seq++;H.ev={k,...o}};

function bestTileForPlayer(p){
  let best=-1,bt=(p.hand||[])[0];
  (p.hand||[]).forEach(x=>{
    const s=(x[0]==x[1]?1000:0)+x[0]+x[1];
    if(s>best){best=s;bt=x}
  });
  return bt;
}

function clearFirstTimer(){
  if(firstPlayTimer){clearTimeout(firstPlayTimer);firstPlayTimer=null}
}

function deal(){
  clearFirstTimer();
  const n=H.players.length,mx=n>4?9:6,t=[];
  for(let a=0;a<=mx;a++)for(let b=a;b<=mx;b++)t.push([a,b]);
  sh(t);
  const k=n>6?6:7;
  H.players.forEach(p=>{p.hand=t.splice(0,k);p.off=false});
  H.yard=H.mode=='draw'?t:[];
  H.chain=[];H.passes=0;H.res=null;
  suitChoice=null;lastSuitKey='';

  // Selalu mulai dengan Suit / Hompimpa untuk semua jumlah pemain (2 - 8)
  H.phase='suit';
  H.suit={picks:{},draw:false};
  em('suit',{pi:0});
  bc();
}

function beatsSuit(a,b){
  return (a==='rock'&&b==='scissors')||(a==='scissors'&&b==='paper')||(a==='paper'&&b==='rock');
}

function resolveMultiSuit(activePlayers,picks){
  // Jika semua memilih sama -> seri total
  const vals=activePlayers.map(p=>picks[p.id]);
  const uniq=[...new Set(vals)];
  if(uniq.length===1)return {draw:true,winIdx:-1};

  // Cari pemain yang tidak dikalahkan oleh pilihan lawan manapun
  const contenders=activePlayers.filter((p,idx)=>{
    const myC=picks[p.id];
    return !activePlayers.some((other,oIdx)=>oIdx!==idx&&beatsSuit(picks[other.id],myC));
  });

  if(contenders.length===1){
    const winIdx=H.players.findIndex(p=>p.id===contenders[0].id);
    return {draw:false,winIdx};
  }
  if(contenders.length>1){
    // Pilih acak di antara pemenang bersama (hompimpa/suit seri sebagian)
    const chosen=R(contenders);
    const winIdx=H.players.findIndex(p=>p.id===chosen.id);
    return {draw:false,winIdx};
  }
  return {draw:true,winIdx:-1};
}

function finishSuitWin(winIdx,summary){
  const idx=winIdx>=0?winIdx:0;
  const starterTile=bestTileForPlayer(H.players[idx]);
  H.phase='play';
  H.turn=idx;
  H.suit=null;
  em('suit_win',{pi:idx,summary});
  bc();
  clearFirstTimer();
  firstPlayTimer=setTimeout(()=>{
    firstPlayTimer=null;
    if(H&&H.phase==='play'&&H.chain.length===0&&starterTile){
      play(idx,starterTile,'R');
    }
  },800);
}

function checkSuitProgress(){
  if(!H||H.phase!=='suit'||!H.suit)return;
  const active=H.players.filter(p=>!p.off);
  if(active.length===0)return finishSuitWin(0,'');
  if(active.length===1){
    const winIdx=H.players.findIndex(p=>p.id===active[0].id);
    return finishSuitWin(winIdx,'');
  }
  const allPicked=active.every(p=>Boolean(H.suit.picks[p.id]));
  if(!allPicked){
    bc();
    return;
  }
  const summary=active.map(p=>`${p.emo}${SUIT[H.suit.picks[p.id]]}`).join(' ');
  const res=resolveMultiSuit(active,H.suit.picks);
  if(res.draw){
    H.suit={picks:{},draw:true};
    em('suit_draw',{pi:0,summary});
    bc();
  }else{
    finishSuitWin(res.winIdx,summary);
  }
}

function handleSuit(pid,choice){
  if(!H||H.phase!=='suit'||!H.suit)return;
  if(!['rock','paper','scissors'].includes(choice))return;
  const p=H.players.find(x=>x.id===pid);
  if(!p||p.off)return;
  H.suit.picks[pid]=choice;
  checkSuitProgress();
}

function act(pid,m){
  if(!H)return;
  if(m.t=='chat')return chatAll(pid,m.m);
  if(m.t=='suit')return handleSuit(pid,m.choice);
  const i=H.players.findIndex(p=>p.id==pid);
  if(H.phase!='play'||i!=H.turn)return;
  if(m.t=='play')play(i,m.tile,m.side);
  else if(m.t=='draw')draw(i);
  else if(m.t=='pass')pass(i);
}

function play(i,tl,side){
  clearFirstTimer();
  const p=H.players[i],ix=p.hand.findIndex(x=>x[0]==tl[0]&&x[1]==tl[1]);
  if(ix<0)return;
  const[a,b]=tl,c=H.chain;
  if(!c.length)c.push([a,b]);
  else if(side=='L'){const L=c[0][0];if(b==L)c.unshift([a,b]);else if(a==L)c.unshift([b,a]);else return}
  else{const r=c.at(-1)[1];if(a==r)c.push([a,b]);else if(b==r)c.push([b,a]);else return}
  p.hand.splice(ix,1);
  H.passes=0;
  em('play',{pi:i,tile:tl,dbl:a==b});
  if(!p.hand.length)return end(i,false);
  next();
}

function draw(i){
  const p=H.players[i];
  if(H.mode!='draw'||!H.yard.length||can(p.hand,H.chain))return;
  p.hand.push(H.yard.pop());
  em('draw',{pi:i});
  bc();
  if(p.off)setTimeout(auto,650);
}

function pass(i){
  const p=H.players[i];
  if(can(p.hand,H.chain)||(H.mode=='draw'&&H.yard.length>0))return;
  H.passes++;
  em('pass',{pi:i});
  if(H.passes>=H.players.length)return end(-1,true);
  next();
}

function next(){
  H.turn=(H.turn+1)%H.players.length;
  bc();
  if(H.players[H.turn].off)setTimeout(auto,800);
}

function auto(){
  if(!H||H.phase!='play')return;
  const i=H.turn,p=H.players[i];
  if(!p||!p.off)return;
  for(const t of p.hand){const s=sides(t,H.chain);if(s.length)return play(i,t,s[0])}
  (H.mode=='draw'&&H.yard.length>0)?draw(i):pass(i);
}

function end(w,blk){
  clearFirstTimer();
  const tot=H.players.map(p=>p.hand.reduce((s,t)=>s+t[0]+t[1],0));
  if(blk){const m=Math.min(...tot);const ws=tot.map((x,i)=>x==m?i:-1).filter(i=>i>=0);w=ws.length==1?ws[0]:-1}
  let pts=0;
  if(w>=0){pts=tot.reduce((s,x)=>s+x,0)-tot[w];H.players[w].score+=pts}
  H.res={w,blk,pts,tot};
  const top=Math.max(...H.players.map(p=>p.score));
  H.phase=top>=H.target?'over':'round';
  em('end',{pi:w});
  bc();
}

/* ---- chat ---- */
function chatAll(pid,m){
  const p=H.players.find(p=>p.id==pid);if(!p)return;
  const o={t:'c',n:p.name,e:p.emo,m:String(m).slice(0,60)};
  for(const id in conns)conns[id].open&&conns[id].send(o);
  onChat(o);
}
function onChat(o){
  snd('chat');const r=RX.includes(o.m);if(r)float(o.m);
  const li=$('#log');li.insertAdjacentHTML('beforeend',`<div>${o.e} <b>${esc(o.n)}</b>: ${esc(o.m)}</div>`);li.scrollTop=1e9;
  if(!$('#chat').classList.contains('on'))toast(`${o.e} <b>${esc(o.n)}</b>: ${esc(o.m)}`,'c');
}

/* ---- tampilan (menggunakan S) ---- */
function onState(s){
  S=s;const ev=s.ev;
  if(s.phase=='lobby'){lastSeq=s.seq;return drawLobby()}
  if(!document.getElementById('game').classList.contains('on'))show('game');
  if(ev&&s.seq!=lastSeq){lastSeq=s.seq;fx(ev)}
  if(s.phase==='suit')renderSuit();
  render();
}

$('#ov').onclick=e=>{
  const sb=e.target.closest('.suit-btn');
  if(sb&&S&&S.phase==='suit'&&S.suit){
    if(S.suit.myDone||suitChoice)return;
    suitChoice=sb.dataset.c;
    lastSuitKey='';
    snd('chat');
    send({t:'suit',choice:suitChoice});
    renderSuit();
    return;
  }
  const nx=e.target.closest('#nx');
  if(nx&&host&&H){
    if(H.phase=='over')H.players.forEach(p=>p.score=0);
    deal();
  }
};

function renderSuit(){
  if(!S||S.phase!=='suit'||!S.suit)return;
  const myDone=Boolean(S.suit.myDone||suitChoice);
  const isMulti=S.players.length>2;
  const key=`${myDone}|${S.suit.doneCount}/${S.suit.total}|${suitChoice||''}|${S.suit.draw}`;
  if(key===lastSuitKey&&$('#ov').classList.contains('on'))return;
  lastSuitKey=key;

  const listHtml=S.players.filter(p=>!p.off).map(p=>{
    const isMe=p.id===me;
    const stText=isMe?(myDone?(suitChoice?SUIT[suitChoice]:'✅'):'⏳'):'Siap / Menunggu';
    return `<div class="pl"><span>${p.emo}</span><b>${esc(p.name)}${isMe?' (Kamu)':''}</b><span>${stText}</span></div>`;
  }).join('');

  ov(`
    <h2>${isMulti?'🙌 Hompimpa / Suit!':'✊✌️🖐️ Suit Penentu!'}</h2>
    <div class="hint">Menang suit = kartu pertamamu langsung turun! (${S.suit.doneCount}/${S.suit.total} sudah pilih)</div>
    <div class="card" style="width:100%">${listHtml}</div>
    <div class="suit-btns">
      <button type="button" class="suit-btn ${suitChoice==='rock'?'picked':''}" data-c="rock" ${myDone?'disabled':''}>✊<small>Batu</small></button>
      <button type="button" class="suit-btn ${suitChoice==='paper'?'picked':''}" data-c="paper" ${myDone?'disabled':''}>🖐️<small>Kertas</small></button>
      <button type="button" class="suit-btn ${suitChoice==='scissors'?'picked':''}" data-c="scissors" ${myDone?'disabled':''}>✌️<small>Gunting</small></button>
    </div>
    <div class="hint">${myDone?'Menunggu pemain lain memilih…':'Pilih salah satu di atas'}</div>
  `);
}

function fx(ev){
  const p=S.players[ev.pi],nm=p?`${p.emo} <b>${esc(p.name)}</b>`:'';
  if(ev.k=='suit'){
    suitChoice=null;lastSuitKey='';
    snd('shuf');
    renderSuit();
  }
  else if(ev.k=='suit_draw'){
    suitChoice=null;lastSuitKey='';
    snd('no');
    toast(`Seri${ev.summary?' ('+ev.summary+')':''}! Suit ulang ya 🤝`);
    renderSuit();
  }
  else if(ev.k=='suit_win'){
    suitChoice=null;lastSuitKey='';
    ov(0);
    snd('win');
    const detail=ev.summary?` (${ev.summary})`:'';
    toast(`${nm} menang suit${detail}! Kartu pertama turun 🎉`);
  }
  else if(ev.k=='deal'){
    ov(0);
    snd('shuf');
    ov(`<div class="shuf">${[0,1,2,3,4,5].map(i=>`<div class="t back" style="animation-delay:${i*.08}s"><i></i><i></i></div>`).join('')}</div><h2>Mengocok kartu… 🎲</h2><div class="hint">Kartu pembuka langsung turun ke meja</div>`);
    setTimeout(()=>{if(S&&S.phase==='play')ov(0)},950);
  }
  else if(ev.k=='play'){
    ov(0);
    snd('play');
    toast(`${nm} ${R(['jreng! 💥','taruh kartu ala sultan 👑','gas pol! 🚀','sikat bleh 😏'])}`+(ev.dbl?' · BALAK! 🔥':''));
    fly={pi:ev.pi,tile:ev.tile};
  }
  else if(ev.k=='draw'){snd('draw');toast(`${nm} ambil kartu 🃏`);if(p&&p.id==me)fly={draw:1}}
  else if(ev.k=='pass'){snd('pass');toast(`${nm} lewat… ${R(['kartunya kena kutukan 🧙','tidur dulu 😴','bengong 🫠'])}`)}
  else if(ev.k=='end'){
    const w=S.res.w;
    snd(w>=0&&S.players[w].id==me?'win':'lose');
    if(w>=0&&S.players[w].id==me)'🎉🏆🥳✨'.match(/./gu).forEach(float);
    setTimeout(()=>ov(1),900);
  }
  if(ev.k!='suit'&&ev.k!='suit_draw'&&S.players[S.turn]&&S.players[S.turn].id==me&&S.phase=='play'&&ev.k!='end'){
    setTimeout(()=>{snd('turn');toast('Giliranmu! 👉')},200);
  }
}

function ov(h){
  const o=$('#ov');
  if(h===0){o.classList.remove('on');return}
  if(h===1){
    const r=S.res,w=r.w>=0?S.players[r.w]:null;
    let x=`<h1>${S.phase=='over'?'🏆 Juara!':(r.blk?'🔒 Buntu!':'🎉 Ronde selesai')}</h1><h2>${w?`${w.emo} ${esc(w.name)} +${r.pts}`:'Seri, tidak ada poin 🤝'}</h2><div class="card" style="width:100%">`+S.players.slice().map((p,i)=>`<div class="pl"><span>${p.emo}</span><b>${esc(p.name)}</b><span class="hint">sisa ${r.tot[i]}</span><b>${p.score}</b></div>`).join('')+'</div>';
    x+=host?`<button type="button" class="btn" id="nx">${S.phase=='over'?'Main lagi dari nol':'Ronde berikutnya'}</button>`:'<div class="hint">Menunggu host…</div>';
    o.innerHTML=x;o.classList.add('on');
  }else{o.innerHTML=h;o.classList.add('on')}
}

function drawLobby(){
  show('lobby');$('#rc').textContent=code;
  $('#pls').innerHTML=S.players.map(p=>`<div class="pl"><span style="font-size:26px">${p.emo}</span><b>${esc(p.name)}</b>${p.id=='H'?'<span class="hint">host</span>':''}</div>`).join('')+`<div class="hint" style="margin-top:6px">${S.players.length}/8 pemain</div>`;
  $('#hopt').style.display=host?'flex':'none';
  $('#go').style.display=host?'block':'none';
  $('#go').disabled=S.players.length<2;
  $('#wt').textContent=host?(S.players.length<2?'Tunggu minimal 1 teman lagi…':''):'Menunggu host memulai…';
}

function render(){
  const mi=S.players.findIndex(p=>p.id==me);
  if(mi<0)return;
  $('#top').innerHTML=S.players.map((p,i)=>`<div class="chip ${i==S.turn&&S.phase=='play'?'on':''} ${p.off?'off':''}" data-p="${i}"><em>${p.emo}</em>${esc(p.name)}<br>🁢 ${p.n} · ⭐ ${p.score}</div>`).join('')+(S.mode=='draw'?`<div class="chip" id="yd"><em>🃏</em>Tumpukan<br>${S.yn}</div>`:'');
  board();hand();
  const my=S.players[S.turn]&&S.players[S.turn].id==me&&S.phase=='play';
  const h=S.players[mi].hand||[],cp=can(h,S.chain),chain=S.chain.length>0;
  $('#dr').style.display=S.mode=='draw'?'':'none';
  $('#dr').disabled=!(my&&S.mode=='draw'&&S.yn>0&&!cp&&chain);
  $('#ps').disabled=!(my&&!cp&&chain&&!(S.mode=='draw'&&S.yn>0));
  const b=$('#bar');
  if(sel&&my){
    const t=sel,s=sides(t,S.chain);
    b.innerHTML=s.map(x=>`<button type="button" class="btn" data-s="${x}">${x=='L'?'◀ Kiri ('+S.chain[0][0]+')':'Kanan ('+S.chain.at(-1)[1]+') ▶'}</button>`).join('');
  }else{
    b.innerHTML=S.phase!='play'?'':my?(chain?(cp?'<span>Pilih kartu yang menyala ✨</span>':'<span>Kartu tidak cocok — tekan '+(S.mode=='draw'&&S.yn>0?'Ambil':'Lewat')+'</span>'):'<span>Kartu pembuka siap!</span>'):`<span class="hint">Giliran ${S.players[S.turn].emo} ${esc(S.players[S.turn].name)}…</span>`;
  }
}

/* Rantai berkelok (snake) dengan konektor antar ubin & belokan kanan/kiri */
function board(){
  const el=$('#board');
  if(!S.chain||!S.chain.length){
    el.innerHTML=`<div class="hint">Meja kosong… 🎲</div>`;
    return;
  }
  const W=Math.max(200,Math.min(el.clientWidth,480)-28);
  const u=+getComputedStyle(document.documentElement).getPropertyValue('--h').replace('px','')||26;
  const rows=[[]];let w=0;

  S.chain.forEach((t,i)=>{
    const tw=(t[0]==t[1]?u:u*2)+8;
    if(w+tw>W&&rows.at(-1).length){rows.push([]);w=0}
    rows.at(-1).push([t,i]);w+=tw;
  });

  const parts=[];
  rows.forEach((r,ri)=>{
    const rev=ri%2===1;
    const ordered=rev?r.slice().reverse():r;
    const rowHtml=ordered.map(([t,i])=>{
      const d=t[0]==t[1];
      const a=rev?t[1]:t[0];
      const b=rev?t[0]:t[1];
      return `<span data-i="${i}">${tile(a,b,d)}</span>`;
    }).join('');
    parts.push(`<div class="row ${rev?'rev':''}">${rowHtml}</div>`);

    // Tambahkan penghubung vertikal ke baris berikutnya di sisi kanan (jika baris genap) atau kiri (jika baris ganjil)
    if(ri<rows.length-1){
      const turnSide=rev?'l':'r';
      const bridgeTile=rows[ri+1][0]?.[0];
      const bridgeHtml=bridgeTile?tile(bridgeTile[0],bridgeTile[1],true):'';
      parts.push(`<div class="turn-v ${turnSide}">${bridgeHtml}</div>`);
    }
  });

  el.innerHTML=`<div class="chain-wrap">${parts.join('')}</div>`;

  const ev=S.ev;
  if(ev&&ev.k=='play'&&fly&&fly.tile){
    const idx=ev.tile,sp=[...el.querySelectorAll('.t')].find(x=>{const a=+x.dataset.a,b=+x.dataset.b;return(a==idx[0]&&b==idx[1])||(a==idx[1]&&b==idx[0])});
    if(sp){
      const f=fly.fromRect||(()=>{const c=document.querySelector(`.chip[data-p="${fly.pi}"]`);return c&&c.getBoundingClientRect()})();
      if(f){
        const r=sp.getBoundingClientRect();
        sp.animate([{transform:`translate(${f.left+f.width/2-r.left-r.width/2}px,${f.top+f.height/2-r.top-r.height/2}px) scale(1.5) rotate(-25deg)`,opacity:.35},{transform:'none',opacity:1}],{duration:460,easing:'cubic-bezier(.2,.9,.3,1.25)'});
      }
      sp.scrollIntoView({block:'center',behavior:'smooth'});
    }
    fly=null;
  }
}

let dealt=-1;
function hand(){
  const mi=S.players.findIndex(p=>p.id==me),h=S.players[mi].hand||[];
  const my=S.players[S.turn]&&S.players[S.turn].id==me&&S.phase=='play';
  const el=$('#hand');
  el.innerHTML=h.map((t,i)=>{
    const ok=my&&sides(t,S.chain).length;
    const cls=my?(ok?'ok':'no'):'';
    const isSel=sel&&sel[0]==t[0]&&sel[1]==t[1]?'sel':'';
    return `<span data-idx="${i}">${tile(t[0],t[1]).replace('class="t ','class="t '+cls+' '+isSel+' ')}</span>`;
  }).join('');
  el.style.justifyContent=el.scrollWidth<=el.clientWidth?'center':'flex-start';
  if(S.ev&&S.ev.k=='deal'&&dealt!=S.seq){
    dealt=S.seq;
    el.querySelectorAll('.t').forEach((t,i)=>t.animate([{transform:'translateY(-50vh) scale(.5) rotate(120deg)',opacity:0},{transform:'none',opacity:1}],{duration:450,delay:150+i*45,fill:'backwards',easing:'cubic-bezier(.2,.9,.3,1.2)'}));
  }else if(fly&&fly.draw){
    const l=el.lastElementChild,y=$('#yd');
    if(l&&y){
      const a=y.getBoundingClientRect(),b=l.getBoundingClientRect();
      l.animate([{transform:`translate(${a.left-b.left}px,${a.top-b.top}px) scale(.5)`,opacity:.3},{transform:'none',opacity:1}],{duration:420,easing:'ease-out'});
    }
    fly=null;
  }
}

$('#hand').onclick=e=>{
  const sp=e.target.closest('span[data-idx]');
  if(!sp||!S||S.phase!=='play')return;
  const mi=S.players.findIndex(p=>p.id==me);
  const t=(S.players[mi].hand||[])[+sp.dataset.idx];
  if(t)pick(t,sp.firstElementChild);
};

function pick(t,el){
  const my=S.players[S.turn]&&S.players[S.turn].id==me&&S.phase=='play';
  if(!my){snd('no');toast('Sabar, bukan giliranmu 😤');return}
  const s=sides(t,S.chain);
  if(!s.length){
    snd('no');
    if(el){el.classList.add('shake');setTimeout(()=>el.classList.remove('shake'),400)}
    toast(R(['Kartu itu nggak cocok 🙅','Ngawur ah 🤨','Coba lihat ujungnya 👀']));
    return;
  }
  if(!S.chain.length||s.length==1||S.chain[0][0]==S.chain.at(-1)[1])return go(t,s[s.length-1],el);
  sel=t;render();
}

function go(t,side,el){
  const f=el?el.getBoundingClientRect():null;
  fly={pi:S.players.findIndex(p=>p.id==me),tile:t,fromRect:f};
  sel=null;
  send({t:'play',tile:t,side});
}

/* ---- event ---- */
$('#eo').innerHTML=EM.map(e=>`<span>${e}</span>`).join('');
const pe=()=>[...$('#eo').children].forEach(s=>s.classList.toggle('s',s.textContent==emo));pe();
$('#eo').onclick=e=>{if(e.target.tagName=='SPAN'){emo=e.target.textContent;pe();snd('chat')}};
const nm=()=>{name=$('#nm').value.trim()||R(['Si Kocak','Bang Gaple','Mas Balak','Neng Domino']);try{ac=ac||new AudioContext();if(ac.state==='suspended')ac.resume()}catch(e){}return true};

$('#mk').onclick=()=>{nm();$('#mk').disabled=true;$('#mk').textContent='Membuat room…';startHost()};
$('#jn').onclick=()=>{const c=$('#cd').value.trim();if(c.length<4)return toast('Isi kode 4 huruf dulu 🔤');nm();join(c)};
if(location.hash.length==5){$('#cd').value=location.hash.slice(1);$('#hs').textContent='Kode dari link sudah terisi. Tinggal tekan Gabung 👆'}
$('#cp').onclick=()=>{const u=location.href.split('#')[0]+'#'+code;(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>toast('Link disalin 📋'),()=>prompt('Salin link:',u))};
$('#go').onclick=()=>{if(!H)return;H.mode=$('#md').value;H.target=+$('#tg').value;H.players.forEach(p=>p.score=0);deal()};
$('#dr').onclick=()=>send({t:'draw'});
$('#ps').onclick=()=>send({t:'pass'});
$('#bar').onclick=e=>{const s=e.target.dataset.s;if(s&&sel)go(sel,s)};
$('#ct').onclick=()=>$('#chat').classList.add('on');
$('#cc').onclick=()=>$('#chat').classList.remove('on');
$('#qk').innerHTML=QK.map(q=>`<span>${q}</span>`).join('');
$('#rx').innerHTML=RX.map(q=>`<span style="font-size:22px">${q}</span>`).join('');
const sc=m=>{if(m)host?chatAll('H',m):hc&&hc.open&&hc.send({t:'chat',m})};
$('#qk').onclick=$('#rx').onclick=e=>{if(e.target.tagName=='SPAN')sc(e.target.textContent)};
$('#cs').onclick=()=>{sc($('#ci').value.trim());$('#ci').value=''};
$('#ci').onkeydown=e=>{if(e.key=='Enter')$('#cs').click()};
</script></body></html>
